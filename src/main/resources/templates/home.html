<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Session Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-dark text-light">

    <p th:text="'Thymeleaf is working!'"></p>


    <div class="container mt-4">
        <h1 class="mb-3">📸 Session Screenshots</h1>
        <p>Total screenshots: 
            <span th:text="${session.screenshots != null ? #lists.size(session.screenshots) : 0}"></span>
        </p>
        <p>Session ID: <span th:text="${session.id}"></span></p>        
        <div th:if="${session.screenshots}">
            <div class="row row-cols-1 row-cols-md-2 g-4">
                <div class="col" th:each="shot : ${session.screenshots}">
                    <div class="card bg-secondary text-light">
                        <div class="card-body">
                            <p class="card-text"><strong>Captured:</strong> <span th:text="${shot.capturedAt}"></span>
                                Total screenshots: <span th:text="${session.screenshots != null ? #lists.size(session.screenshots) : 0}"></span>
                                Caminho imagem: <span th:text="${shot.filePath}"></span><br/>
                            </p>
                            <img th:src="@{|/screenshots/${shot.filePath}|}" class="img-fluid rounded" />
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <hr class="my-4" />

        <h2>🧠 GPT Response</h2>
        <div th:if="${session.response != null}">
            <pre class="bg-light text-dark p-3 rounded" th:text="${session.response.content}"></pre>
        </div>
        <div th:if="${session.response == null}">
            <p class="text-muted">No response yet.</p>
        </div>
    </div>

</body>

</html>
